# Stack Movix auto-hebergee — usage personnel.
#
# Six services : MySQL, Redis, l'API principale, le proxy de streaming
# Python, le service Watch Party, et le frontend.
#
# ## Exposition reseau
#
# Par defaut les ports sont publies sur toutes les interfaces de la machine
# (0.0.0.0) : le service est donc joignable depuis le reseau local ET depuis
# le tailnet si Tailscale tourne sur l'hote. Il n'est PAS joignable depuis
# Internet tant qu'aucune redirection de port n'est configuree sur la box.
#
# Pour restreindre a la seule machine, mettre BIND_ADDRESS=127.0.0.1 dans le
# `.env`. Voir DEPLOIEMENT.md pour l'acces a distance.
#
# MySQL et Redis ne publient aucun port : ils ne sont joignables que par les
# autres conteneurs, sur le reseau interne. C'est volontaire — une base
# exposee sur le LAN est la premiere chose que scanne un voisin de reseau.

name: movix

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- base ---
  mysql:
    <<: *restart
    # 8.0 et non 8.4 : la 8.4 a retire le plugin mysql_native_password et
    # change plusieurs defauts. Deux clients tres differents tapent sur cette
    # base — mysql2 cote Node, aiomysql/PyMySQL cote Python — et la 8.0 est
    # celle avec laquelle les deux sont le mieux eprouves. PyMySQL gere
    # caching_sha2_password grace a `cryptography`, present dans
    # requirements.txt : rien a assouplir cote authentification.
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 12 workers x 20 connexions depasserait le defaut de 151.
      - --max-connections=300
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant - lance ./deploy/setup.sh}
      MYSQL_DATABASE: ${DB_NAME:-movix}
      MYSQL_USER: ${DB_USER:-movix}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant - lance ./deploy/setup.sh}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [movix]

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD manquant - lance ./deploy/setup.sh}", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [movix]

  # ------------------------------------------------------------ backends ---
  mainapi:
    <<: *restart
    build:
      context: .
      dockerfile: deploy/Dockerfile.mainapi
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      NODE_ENV: production
      PORT: 25565
      # 12 par defaut dans le code : dimensionne pour un serveur 6 coeurs.
      # Sur une machine personnelle c'est 12 fois la memoire pour rien.
      NUM_WORKERS: ${NUM_WORKERS:-2}

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-movix}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-movix}
      DB_POOL_CONNECTION_LIMIT: ${DB_POOL_CONNECTION_LIMIT:-10}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant - lance ./deploy/setup.sh}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      TMDB_API_KEY: ${TMDB_API_KEY:?TMDB_API_KEY manquant - cle gratuite sur themoviedb.org}

      # Secret partage avec proxiesembed : les deux DOIVENT etre identiques,
      # sinon aucune URL media signee n'est acceptee (fail-closed).
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?MEDIA_SIGNING_SECRET manquant - lance ./deploy/setup.sh}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY manquant - lance ./deploy/setup.sh}

      # --- Les trois URLs de proxiesembed, a ne pas confondre ---
      #
      # Elles designent le meme service mais ne sont pas interchangeables :
      # deux sont internes au reseau Docker, la troisieme est remise au
      # navigateur. `utils/embedExtraction.js` les essaie dans cet ordre —
      # INTERNAL, puis PUBLIC, puis PROXY_SERVER_URL ampute de /proxy.
      #
      # D'ou un piege : renseigner PUBLIC sans renseigner INTERNAL fait
      # prendre la valeur publique pour les appels serveur a serveur. Avec un
      # PUBLIC en loopback, mainapi s'appelle alors lui-meme, toutes les
      # extractions echouent, et l'app retombe sur les embeds en iframe sans
      # qu'aucune erreur ne remonte (le catch d'extractEmbed est muet : un
      # hebergeur mort est le cas normal).

      # Relais de flux, serveur a serveur.
      PROXY_SERVER_URL: http://proxiesembed:25569/proxy

      # Extraction des sources, serveur a serveur. Nom de service Docker :
      # resolu par le DNS interne du reseau compose.
      PROXIESEMBED_INTERNAL_URL: ${PROXIESEMBED_INTERNAL_URL:-http://proxiesembed:25569}

      # URL de proxiesembed vue depuis le NAVIGATEUR (sous-titres KissKH).
      # N'est PAS utilisable pour les appels serveur a serveur : c'est le role
      # de PROXIESEMBED_INTERNAL_URL ci-dessus.
      #
      # Elle doit etre fournie explicitement, car sans elle `routes/kisskh.js`
      # retombe sur l'origine de PROXY_SERVER_URL — donc `http://proxiesembed:25569`,
      # que son validateur refuse : il n'accepte `http://` que sur du loopback,
      # tout autre hote devant etre en `https://`. Le refus leve une TypeError
      # AU CHARGEMENT du module, hors de tout try/catch : mainapi ne demarre
      # pas du tout et le cluster boucle sur le redemarrage.
      #
      # Le defaut loopback satisfait le validateur et laisse le serveur
      # demarrer. La consequence est circonscrite a KissKH (dramas asiatiques) :
      # l'URL remise au client pointerait vers sa propre machine, donc ses
      # sous-titres ne chargeraient pas. Aucune autre source n'utilise cette
      # valeur. Sur un deploiement en HTTPS, mettre ici l'origine publique
      # (https://exemple.tld:25569) pour retablir KissKH.
      PROXIESEMBED_PUBLIC_URL: ${PROXIESEMBED_PUBLIC_URL:-http://127.0.0.1:25569}
      KISSKH_ENABLED: ${KISSKH_ENABLED:-false}
      PUBLIC_API_BASE: ${PUBLIC_MAIN_API}
      FRONTEND_BASE_URL: ${PUBLIC_SITE_URL}
      # Remplace la liste de domaines codee en dur (qui contenait des tiers).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

      # Domaines des sources — a mettre a jour quand une source deplace son
      # site. C'est le principal geste de maintenance du catalogue.
      WIFLIX_BASE_URL: ${WIFLIX_BASE_URL:-}
      COFLIX_BASE_URL: ${COFLIX_BASE_URL:-}
      CINESTREAM_BASE_URL: ${CINESTREAM_BASE_URL:-}
      DARKIWORLD_BASE_URL: ${DARKIWORLD_BASE_URL:-}
      J1F_BASE_URL: ${J1F_BASE_URL:-}
      SWIFTFLOW_BASE_URL: ${SWIFTFLOW_BASE_URL:-}

      # --- Live TV ---
      # Vavoo : seule source TV qui marche sans rien (ni cle, ni VIP, ni
      # extension). Son domaine tourne comme les autres.
      VAVOO_BASE_URL: ${VAVOO_BASE_URL:-}
      # Northlive : cle partenaire. Sans elle la source reste vide — ce n'est
      # pas une erreur de configuration, c'est une cle qu'on n'a pas.
      NORTHLIVE_API_KEY: ${NORTHLIVE_API_KEY:-}
      # Xtream : TON abonnement IPTV, si tu en as un. Reserve aux comptes VIP
      # cote app (cf. DEPLOIEMENT.md pour se declarer VIP sur son instance).
      XTREAM_URL: ${XTREAM_URL:-}
      XTREAM_USER: ${XTREAM_USER:-}
      XTREAM_PASS: ${XTREAM_PASS:-}
    volumes:
      - mainapi-cache:/app/cache
      - mainapi-data:/app/data
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:25565:25565"
    networks: [movix]

  proxiesembed:
    <<: *restart
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxiesembed
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-movix}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-movix}

      # Identique a mainapi, sans exception.
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET}
      MEDIA_SIGNATURE_TTL: ${MEDIA_SIGNATURE_TTL:-43200}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

      PROXY_BASE: ${PUBLIC_PROXIES_EMBED_API}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:25569:25569"
    networks: [movix]

  watchparty:
    <<: *restart
    build:
      context: .
      dockerfile: deploy/Dockerfile.watchparty
    environment:
      WATCHPARTY_PORT: 25566
      WATCHPARTY_REST_CORS_ORIGIN: ${PUBLIC_SITE_URL}
      WATCHPARTY_SOCKET_CORS_ORIGIN: ${PUBLIC_SITE_URL}
      WATCHPARTY_CORS_CREDENTIALS: "true"
      WATCHPARTY_ADMIN_SECRET: ${WATCHPARTY_ADMIN_SECRET:?WATCHPARTY_ADMIN_SECRET manquant - lance ./deploy/setup.sh}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:25566:25566"
    networks: [movix]

  # ------------------------------------------------------------ frontend ---
  frontend:
    <<: *restart
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vite fige ces valeurs DANS le bundle au moment du build : elles
        # doivent etre les URLs vues par le NAVIGATEUR, pas les noms de
        # services Docker. Changer une de ces variables impose un
        # `docker compose build frontend`, un restart ne suffit pas.
        VITE_SITE_URL: ${PUBLIC_SITE_URL}
        VITE_MAIN_API: ${PUBLIC_MAIN_API}
        VITE_WATCHPARTY_API: ${PUBLIC_WATCHPARTY_API}
        VITE_PROXIES_EMBED_API: ${PUBLIC_PROXIES_EMBED_API}
        VITE_TMDB_API_KEY: ${TMDB_API_KEY}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_TURNSTILE_INVISIBLE_SITEKEY: ${VITE_TURNSTILE_INVISIBLE_SITEKEY:-}
        VITE_SUPPORT_TELEGRAM_URL: ${VITE_SUPPORT_TELEGRAM_URL:-}
        VITE_APP_BUILD_ID: ${VITE_APP_BUILD_ID:-selfhosted}
        # Confinement des iframes d'hebergeurs : strict (defaut) | balanced | off.
        # Fige dans le bundle au build — un changement impose
        # `docker compose build frontend`. Voir src/utils/embedSandbox.ts.
        VITE_EMBED_SANDBOX: ${VITE_EMBED_SANDBOX:-strict}
    environment:
      PORT: 3001
      # Lues par server/securityHeaders.js pour construire le connect-src.
      VITE_MAIN_API: ${PUBLIC_MAIN_API}
      VITE_WATCHPARTY_API: ${PUBLIC_WATCHPARTY_API}
      VITE_PROXIES_EMBED_API: ${PUBLIC_PROXIES_EMBED_API}
      # Decommenter uniquement pour diagnostiquer un blocage CSP.
      # CSP_DISABLED: "true"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:3001:3001"
    networks: [movix]

volumes:
  mysql-data:
  redis-data:
  mainapi-cache:
  mainapi-data:

networks:
  movix:
    driver: bridge
